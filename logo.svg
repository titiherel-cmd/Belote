<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dégradé du fond (Assorti à ton appli de belote) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3d59" />
      <stop offset="100%" stop-color="#17b978" />
    </linearGradient>
    
    <!-- Dégradé Doré pour les lettres ARL -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#f5b041" />
      <stop offset="100%" stop-color="#9a7d0a" />
    </linearGradient>

    <!-- Ombre portée pour donner du relief -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond carré arrondi (style icône d'application mobile) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Cercle central festonné discret -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="15 10" />

  <!-- Les 4 enseignes de cartes à jouer (Style épuré blanc) -->
  <g fill="#ffffff" fill-opacity="0.85" transform="scale(0.8) translate(64, 64)">
    <!-- Pique ♠ -->
    <path d="M256,70 C210,130 170,165 170,200 C170,235 200,250 225,250 C245,250 250,235 256,235 C262,235 267,250 287,250 C312,250 342,235 342,200 C342,165 302,130 256,70 Z" />
    <path d="M256,220 L236,280 L276,280 Z" />
    
    <!-- Coeur ♥ -->
    <path d="M256,430 C200,370 150,330 150,285 C150,250 175,225 210,225 C235,225 250,245 256,255 C262,245 277,225 302,225 C337,225 362,250 362,285 C362,330 312,370 256,430 Z" transform="translate(0, -110)" />

    <!-- Carreau ♦ -->
    <path d="M256,150 L336,256 L256,362 L176,256 Z" transform="translate(130, 0)" />

    <!-- Trèfle ♣ -->
    <path d="M256,190 C270,190 285,175 285,160 C285,145 270,135 256,135 C242,135 227,145 227,160 C227,175 242,190 256,190 Z M210,225 C225,225 235,210 235,195 C235,180 220,170 210,170 C200,170 185,180 185,195 C185,210 200,225 210,225 Z M302,225 C317,225 327,210 327,195 C327,180 312,170 302,170 C292,170 277,180 277,195 C277,210 292,225 302,225 Z" transform="translate(-130, 0)" />
    <path d="M126,210 L106,260 L146,260 Z" transform="translate(-130, 0)" />
  </g>

  <!-- Texte central "ARL" -->
  <text x="256" y="295" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, sans-serif" 
        font-size="115" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="2"
        filter="url(#shadow)">ARL</text>
</svg>
